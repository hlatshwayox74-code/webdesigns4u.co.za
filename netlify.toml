[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # Bundles the shared concept engine/renderer (assets/js) into the email function.
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Videos and posters: cached for a week. Rename the file when you replace a clip
# (e.g. hero-v2.mp4) and update assets/js/config.js so visitors get the new one.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Lets the downloaded template file (opened from disk) load the brand font.
    Access-Control-Allow-Origin = "*"

# Design and scripts: browsers check for a newer version on every visit
# (cheap thanks to ETags), so updates show up immediately.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
