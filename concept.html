<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your website template | Web Designs4U</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Archivo"; src: url("/assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --ink: #f2f4f5; --dim: #8a979d; --line: rgba(242,244,245,.16); --accent: #ff7a2f; --bar: 60px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 2; display: flex; align-items: center; gap: 14px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); background: #000; border-bottom: 1px solid var(--line); }
.bar__brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14px; white-space: nowrap; }
.bar__brand img { width: 26px; height: 26px; border-radius: 4px; }
.bar__title { min-width: 0; flex: 1; font-size: 14px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar__title b { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { font: inherit; font-size: 13px; color: var(--dim); background: none; border: 0; min-height: 36px; padding: 0 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #000; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; border: 1px solid var(--line); color: var(--ink); }
.btn--accent { background: var(--accent); border-color: transparent; color: #050505; }
.btn svg { width: 18px; height: 18px; color: #25d366; }
.stage { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: #0b0b0b; }
.stage iframe { border: 0; width: 100%; height: 100%; background: #fff; transition: width .5s cubic-bezier(.2,.7,0,1); }
.stage.is-phone { padding: 18px 0; }
.stage.is-phone iframe { width: 390px; max-width: 100%; border-radius: 24px; border: 8px solid #1a1d20; }
.empty { display: grid; place-content: center; gap: 16px; height: 100%; padding: 24px; text-align: center; }
.empty h1 { margin: 0; font-size: clamp(28px, 6vw, 52px); text-transform: uppercase; font-variation-settings: "wdth" 62; font-weight: 800; line-height: .95; }
.empty p { margin: 0; color: var(--dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 760px) {
  .bar__title, .seg, .btn__long { display: none; }
  .bar { gap: 8px; }
  .bar__brand span { display: none; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
}
@media (min-width: 761px) { .actions { display: flex; gap: 8px; } }
</style>
</head>
<body>
<header class="bar">
  <a class="bar__brand" href="/"><img src="/assets/icons/favicon-48.png" alt="" width="26" height="26"><span>Web Designs4U</span></a>
  <p class="bar__title" id="title">Website template</p>
  <div class="seg" role="group" aria-label="Preview size">
    <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-view="phone" aria-pressed="false">Phone</button>
  </div>
  <div class="actions">
    <a class="btn" id="wa" href="https://wa.me/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/></svg><span class="btn__long">WhatsApp us</span></a>
    <a class="btn btn--accent" id="build" href="/">Build this website</a>
  </div>
</header>
<main class="stage" id="stage"></main>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/concept-engine.js"></script>
<script src="/assets/js/concept-render.js"></script>
<script>
(function () {
  const C = window.WD4U_CONFIG, E = window.WD4U_Concept, R = window.WD4U_RenderConcept;
  const code = new URLSearchParams(location.search).get("c");
  const inputs = code ? E.decodeInputs(code) : null;
  const stage = document.getElementById("stage");
  const wa = document.getElementById("wa");
  const waBase = "https://wa.me/" + String(C.contact.whatsappIntl || "").replace(/\D/g, "");
  if (!inputs) {
    document.getElementById("title").textContent = "Template link incomplete";
    stage.innerHTML = '<div class="empty"><h1>Build your own<br>website template.</h1><p>This link is incomplete. Answer four questions and see your website take shape.</p><p><a class="btn btn--accent" href="/#ch-you">Start now</a></p></div>';
    wa.href = waBase;
    return;
  }
  const cx = E.build(inputs, inputs.variant);
  document.title = cx.name + " | Website template " + cx.id + " | Web Designs4U";
  document.getElementById("title").innerHTML = 'Template <b></b> for <b></b> · ' + cx.category + ' · ' + cx.style + ' feel';
  const bs = document.querySelectorAll("#title b"); bs[0].textContent = cx.id; bs[1].textContent = cx.name;
  document.getElementById("build").href = "/?c=" + encodeURIComponent(code) + "&open=intake";
  wa.href = waBase + "?text=" + encodeURIComponent("Hi Web Designs4U 👋\n\nI'd like to build this website for " + cx.name + " (template " + cx.id + "):\n" + location.href);
  const frame = document.createElement("iframe");
  frame.title = "Website template for " + cx.name;
  frame.srcdoc = R.page(cx, { base: location.origin, animate: !matchMedia("(prefers-reduced-motion: reduce)").matches });
  stage.appendChild(frame);
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
    stage.classList.toggle("is-phone", b.dataset.view === "phone");
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
})();
</script>
</body>
</html>
